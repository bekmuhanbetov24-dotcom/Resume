          <h3 style="margin:0;color:#f1f5f9;font-size:1rem">${esc(c.title)}</h3>
          <p class="field-label" style="margin-top:1rem">${esc(d.ui.caseMandate)}</p><p style="margin:.25rem 0 0;color:#94a3b8;font-size:.875rem;line-height:1.5">${esc(c.mandate)}</p>
          <p class="field-label muted" style="margin-top:.75rem">${esc(d.ui.caseScale)}</p><p style="margin:.25rem 0 0;color:#cbd5e1;font-size:.875rem">${esc(c.scale)}</p>
          <p class="field-label muted" style="margin-top:.75rem">${esc(d.ui.caseResult)}</p><p style="margin:.25rem 0 0;color:#e2e8f0;font-size:.875rem">${esc(c.result)}</p>
          <p class="field-label muted" style="margin-top:.75rem">${esc(d.ui.caseRole)}</p><p style="margin:.25rem 0 0;color:#94a3b8;font-size:.875rem;line-height:1.5">${esc(c.contribution)}</p>
        </div>`).join("")}</div>`;
    }

    function renderExperience(d) {
      return `${sectionHeader(d.ui.expOverline, d.ui.expTitle, d.ui.expLead)}
        <div class="screen-stack">${d.experience.map((j) => `<div class="card">
          <p class="field-label">${esc(j.period)}</p>
          <h3 style="margin:.25rem 0 0;font-size:1rem;color:#f4f4f5">${esc(j.role)}</h3>
          <p class="company" style="margin:.25rem 0 0">${esc(j.company)}</p>
          <p class="desc" style="margin:.5rem 0 0">${esc(j.description)}</p>
          ${j.highlights.length ? `<ul style="margin:.75rem 0 0;padding:0;list-style:none">${j.highlights.map((h) => `<li style="display:flex;gap:.5rem;font-size:.875rem;color:#94a3b8;margin-bottom:.375rem"><span style="color:#60a5fa">▸</span>${esc(h)}</li>`).join("")}</ul>` : ""}
        </div>`).join("")}</div>`;
    }

    function renderCredentials(d) {
      return `
        ${sectionHeader(d.ui.credsOverline, d.ui.credsTitle, d.ui.credsLead)}
        <div class="screen-stack">
        <div class="card">
          <h3 class="card-subtitle">${esc(d.ui.eduTitle)}</h3>
          ${d.education.map((e) => `<div class="edu-item"><p class="period" style="color:#60a5fa;font-size:11px;margin:0">${esc(e.period)}</p>
            <p style="font-weight:500;margin:.25rem 0;font-size:.875rem">${esc(e.title)}</p>
            <p style="font-size:.75rem;color:#64748b;margin:0">${esc(e.note)}</p></div>`).join("")}
          <p style="font-size:.75rem;color:#64748b;margin:1rem 0 .5rem">${esc(d.profile.languages)}</p>
          <div class="badges">${d.skillTags.map((s) => `<span class="badge">${esc(s)}</span>`).join("")}</div>
        </div>
        ${featuredHtml(d)}
        </div>`;
    }

    function renderCertificates(d) {
      return `
        ${sectionHeader(d.ui.certsOverline, d.ui.certsTitle, d.ui.certsLead)}
        <div class="screen-stack">
        <div class="card" style="padding:0;overflow:hidden" id="cert-inline">
          <div class="cert-carousel-viewport" id="cert-inline-viewport">
            <div class="cert-carousel-track" id="cert-inline-track">${certSlidesHtml(d.certificates, "inline")}</div>
          </div>
          <div class="cert-caption" id="cert-inline-caption"></div>
          <div class="cert-controls">
            <button type="button" class="cert-nav-btn" id="cert-inline-prev" aria-label="${esc(d.ui.prev || "Back")}">←</button>
            <div class="cert-dots" id="cert-inline-dots"></div>
            <button type="button" class="cert-nav-btn" id="cert-inline-next" aria-label="${esc(d.ui.next || "Next")}">→</button>
          </div>
        </div></div>`;
    }

    function certTrackOffset(viewportId) {
      const viewport = document.getElementById(viewportId);
      return certIndex * (viewport ? viewport.clientWidth : 0);
    }

    function updateCertPanel(prefix) {
      const d = t();
      const track = document.getElementById(`cert-${prefix}-track`);
      const caption = document.getElementById(`cert-${prefix}-caption`);
      const dots = document.getElementById(`cert-${prefix}-dots`);
      if (!track || !caption || !dots) return;
      const c = d.certificates[certIndex];
      track.style.transform = `translate3d(-${certTrackOffset(`cert-${prefix}-viewport`)}px, 0, 0)`;
      caption.innerHTML = `<p class="year">${esc(c.year)} · ${certIndex + 1} / ${d.certificates.length}</p>
        <h3>${esc(c.title)}</h3><p class="issuer">${esc(c.issuer)}</p>${c.detail ? `<p class="issuer" style="font-size:.75rem;color:#64748b">${esc(c.detail)}</p>` : ""}`;
      dots.innerHTML = d.certificates.map((_, i) =>
        `<button type="button" class="cert-dot${i === certIndex ? " active" : ""}" data-i="${i}" data-prefix="${prefix}"></button>`
      ).join("");
      dots.querySelectorAll(".cert-dot").forEach((el) => {
        el.addEventListener("click", () => { certIndex = +el.dataset.i; syncCertViews(); });
      });
      const prev = document.getElementById(`cert-${prefix}-prev`);
      const next = document.getElementById(`cert-${prefix}-next`);
      if (prev) prev.disabled = certIndex === 0;
      if (next) next.disabled = certIndex === d.certificates.length - 1;
    }

    function syncCertViews() {
      updateCertPanel("inline");
      refreshCertLightbox();
    }

    function closeCertLightbox() {
      certFsOpen = false;
      document.body.style.overflow = "";
      document.getElementById("cert-lightbox")?.remove();
      if (certFsKeyHandler) {
        window.removeEventListener("keydown", certFsKeyHandler);
        certFsKeyHandler = null;
      }
    }

    function refreshCertLightbox() {
      const lb = document.getElementById("cert-lightbox");
      if (!lb || !certFsOpen) return;
      const d = t();
      const c = d.certificates[certIndex];
      const img = document.getElementById("cert-fs-img");
      if (img) img.src = c.image;
      const prev = lb.querySelector(".cert-lightbox-arrow--left");
      const next = lb.querySelector(".cert-lightbox-arrow--right");
      if (prev) prev.style.visibility = certIndex === 0 ? "hidden" : "visible";
      if (next) next.style.visibility = certIndex === d.certificates.length - 1 ? "hidden" : "visible";
    }

    function openCertLightbox(index) {
      const d = t();
      certIndex = index;
      document.getElementById("cert-lightbox")?.remove();
      certFsOpen = true;
      document.body.style.overflow = "hidden";
      const c = d.certificates[certIndex];
      const overlay = document.createElement("div");
      overlay.id = "cert-lightbox";
      overlay.className = "cert-lightbox";
      overlay.innerHTML = `
        <button type="button" class="cert-lightbox-close" aria-label="${esc(d.ui.closeFullscreen)}">×</button>
        <button type="button" class="cert-lightbox-arrow cert-lightbox-arrow--left" id="cert-fs-prev" aria-label="${esc(d.ui.prev || "Back")}" style="visibility:${certIndex === 0 ? "hidden" : "visible"}">←</button>
        <div class="cert-lightbox-stage" id="cert-fs-stage"><img id="cert-fs-img" src="${esc(c.image)}" alt="" draggable="false" /></div>
        <button type="button" class="cert-lightbox-arrow cert-lightbox-arrow--right" id="cert-fs-next" aria-label="${esc(d.ui.next || "Next")}" style="visibility:${certIndex === d.certificates.length - 1 ? "hidden" : "visible"}">→</button>`;
      document.body.appendChild(overlay);
      overlay.querySelector(".cert-lightbox-close")?.addEventListener("click", closeCertLightbox);
      document.getElementById("cert-fs-prev")?.addEventListener("click", () => {
        if (certIndex > 0) { certIndex--; syncCertViews(); }
      });
      document.getElementById("cert-fs-next")?.addEventListener("click", () => {
        if (certIndex < d.certificates.length - 1) { certIndex++; syncCertViews(); }
      });
      const stage = document.getElementById("cert-fs-stage");
      if (stage) {
        stage.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
        stage.addEventListener("touchend", (e) => {
          const dx = touchStartX - e.changedTouches[0].clientX;
          if (dx > 50 && certIndex < d.certificates.length - 1) { certIndex++; syncCertViews(); }
          else if (dx < -50 && certIndex > 0) { certIndex--; syncCertViews(); }
        }, { passive: true });
      }
      certFsKeyHandler = (e) => {
        if (e.key === "Escape") closeCertLightbox();
        if (e.key === "ArrowLeft" && certIndex > 0) { certIndex--; syncCertViews(); }
        if (e.key === "ArrowRight" && certIndex < d.certificates.length - 1) { certIndex++; syncCertViews(); }
      };
      window.addEventListener("keydown", certFsKeyHandler);
    }

    function updateCertSlide() {
      updateCertPanel("inline");
    }

    function bindCertCarousel() {
      closeCertLightbox();
      updateCertSlide();
      document.querySelectorAll(".cert-slide-open[data-cert-prefix='inline']").forEach((btn) => {
        btn.addEventListener("click", () => openCertLightbox(+btn.dataset.certI));
      });
      if (certCarouselBound) return;
      certCarouselBound = true;
      const viewport = document.getElementById("cert-inline-viewport");
      document.getElementById("cert-inline-prev")?.addEventListener("click", () => {
        if (certIndex > 0) { certIndex--; syncCertViews(); }
      });
      document.getElementById("cert-inline-next")?.addEventListener("click", () => {
        if (certIndex < t().certificates.length - 1) { certIndex++; syncCertViews(); }
      });
      if (viewport) {
        viewport.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
        viewport.addEventListener("touchend", (e) => {
          const dx = touchStartX - e.changedTouches[0].clientX;
          if (dx > 50 && certIndex < t().certificates.length - 1) { certIndex++; syncCertViews(); }
          else if (dx < -50 && certIndex > 0) { certIndex--; syncCertViews(); }
        }, { passive: true });
      }
      window.addEventListener("resize", () => {
        if (activeScreen === "certificates") syncCertViews();
      });
    }

    function renderPrint(d) {
      const p = d.profile;
      document.getElementById("print-page").innerHTML = `
        <div class="print-resume">
          <header class="print-resume-header">
            <h1>${esc(p.nameShort)}</h1>
            <p class="print-role">${esc(p.role)} · ${esc(p.location)}</p>
            <p class="print-sub">${esc(p.roleSub)}</p>
            <p class="print-contact">${d.contact.map((c) => esc(c.label)).join(" · ")}</p>
            <p class="print-meta">${esc(p.languages)}</p>
          </header>
          <section>
            <h2>${esc(d.ui.printSummary)}</h2>
            ${p.summary.split("\n\n").filter(Boolean).map((para) => `<p>${esc(para)}</p>`).join("")}
            <ul class="print-inline-list">${p.highlights.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>
            <dl class="print-stats">${d.stats.map((s) => `<div><dt>${esc(s.label)}</dt><dd>${esc(s.value)}${s.hint ? ` (${esc(s.hint)})` : ""}</dd></div>`).join("")}</dl>
          </section>
          <section>
            <h2>${esc(d.ui.expTitle)}</h2>
            ${d.experience.map((j) => `<div class="print-block"><p class="print-period">${esc(j.period)}</p><h3>${esc(j.role)} — ${esc(j.company)}</h3><p>${esc(j.description)}</p>${j.highlights.length ? `<ul>${j.highlights.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}</div>`).join("")}
          </section>
          <section>
            <h2>${esc(d.ui.casesTitle)}</h2>
            ${d.cases.map((c) => `<div class="print-block"><h3>${esc(c.title)}</h3><p><strong>${esc(d.ui.caseResult)}:</strong> ${esc(c.result)}</p><p><strong>${esc(d.ui.caseRole)}:</strong> ${esc(c.contribution)}</p></div>`).join("")}
          </section>
          <section>
            <h2>${esc(d.ui.eduTitle)}</h2>
            <ul>${d.education.map((e) => `<li>${esc(e.period)} — ${esc(e.title)}, ${esc(e.note)}</li>`).join("")}</ul>
          </section>
          <section>
            <h2>${esc(d.ui.printSkills)}</h2>
            <p class="print-skills">${d.skillTags.map((s) => esc(s)).join(" · ")}</p>
          </section>
        </div>`;
    }

    function showScreen(id) {
      activeScreen = id;
      document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.dataset.screen === id));
      document.querySelectorAll(".nav-btn, .mob-nav button").forEach((b) => b.classList.toggle("active", b.dataset.id === id));
      window.scrollTo(0, 0);
      if (id === "certificates") bindCertCarousel();
    }

    function bindLang(root) {
      root?.querySelectorAll("[data-lang]").forEach((btn) => {
        btn.addEventListener("click", () => {
          locale = btn.dataset.lang;
          localStorage.setItem("resume-locale", locale);
          const url = new URL(window.location.href);
          url.searchParams.set("lang", locale);
          window.history.replaceState({}, "", url);
          certCarouselBound = false;
          certIndex = 0;
          closeCertLightbox();
          render();
        });
      });
    }

    function render() {
      const d = t();
      closeCertLightbox();
      if (!d.nav.some((n) => n.id === activeScreen)) activeScreen = "mandate";
      document.title = d.meta.pageTitle;
      document.documentElement.lang = locale;
      const p = d.profile;

      document.getElementById("sidebar").innerHTML = `
        <div><p class="sidebar-name">${esc(p.nameShort.split(" ")[0])}</p><p class="sidebar-role">PO · CTO · CIO</p></div>
        <nav style="flex:1;margin-top:1.5rem">${d.nav.map((n) => `<button type="button" class="nav-btn" data-id="${n.id}"><span class="nav-icon">${n.icon}</span>${esc(n.label)}</button>`).join("")}</nav>
        <div class="sidebar-status">${langToggleHtml("lang-side")}</div>`;

      document.getElementById("lang-mobile").innerHTML = langToggleHtml("lang-mob");
      document.getElementById("mob-nav").innerHTML = d.nav.map((n) =>
        `<button type="button" data-id="${n.id}"><span>${n.icon}</span>${esc(n.short)}</button>`
      ).join("");

      document.getElementById("app").innerHTML = `
        <div class="screen" data-screen="mandate">${renderMandate(d)}</div>
        <div class="screen" data-screen="impact">${renderImpact(d)}</div>
        <div class="screen" data-screen="experience">${renderExperience(d)}</div>
        <div class="screen" data-screen="credentials">${renderCredentials(d)}</div>
        <div class="screen" data-screen="certificates">${renderCertificates(d)}</div>`;

      renderPrint(d);
      certCarouselBound = false;
      document.querySelectorAll("[data-id]").forEach((btn) => {
        btn.addEventListener("click", () => showScreen(btn.dataset.id));
      });
      bindLang(document.getElementById("lang-side"));
      bindLang(document.getElementById("lang-mob"));
      showScreen(activeScreen);
    }

    render();
  </script>
</body>
</html>
